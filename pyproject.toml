[project]
name = "reconx"
version = "1.0.0"
description = "Automated Cross-Engine Data Reconciliation Engine with SQLGlot Pushdown, PySpark Distributed Joins, and Bisection Diffing"
authors = [{ name = "Pruthvi Nag Gattu", email = "gattupruthvinag5@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5.0",
    "duckdb>=0.10.2",
    "sqlglot>=23.0.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "streamlit>=1.33.0",
    "plotly>=5.20.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
]

[project.scripts]
reconx = "reconx.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
